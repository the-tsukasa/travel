# Fly.io 配置文件
# 使用前请先运行: fly launch

app = "travel-app"
primary_region = "hkg"  # 香港，可根据需要修改为其他区域（如 nrt, sin, syd 等）

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  SPRING_PROFILES_ACTIVE = "production"
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[services.mounts]]
  source = "uploads"
  destination = "/uploads"

