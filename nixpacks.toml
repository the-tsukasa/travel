# Nixpacks 配置文件
# Railway 使用 Nixpacks 自动检测和构建项目

[providers]
java = "17"

[phases.setup]
nixPkgs = ["maven", "jdk17"]

[phases.install]
cmds = [
  "chmod +x ./mvnw || true",
  "./mvnw clean package -DskipTests",
  "echo '=== 检查构建结果 ==='",
  "ls -la target/ || echo 'target 目录不存在'",
  "find target -name '*.jar' -type f || echo '未找到 JAR 文件'",
  "ls -la target/travel*.jar || echo '未找到 travel JAR 文件'"
]

[start]
cmd = "sh -c 'JAR=$(find target -name \"travel*.jar\" -type f | head -1) && if [ -z \"$JAR\" ]; then echo \"错误: 未找到 JAR 文件\"; ls -la target/; exit 1; else echo \"找到 JAR: $JAR\"; java -jar \"$JAR\"; fi'"

