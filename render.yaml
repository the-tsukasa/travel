services:
  - type: web
    name: travel-app
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/travel-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: travel-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: travel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: travel-db
          property: password
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /actuator/health

databases:
  - name: travel-db
    plan: free
    databaseName: travel_db
    databaseUser: travel_user

