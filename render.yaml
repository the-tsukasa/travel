services:
  - type: web
    name: travel-app
    env: java
    # 构建命令：Maven 会自动构建前端（通过 frontend-maven-plugin）
    # 不再需要手动构建前端，pom.xml 中已集成前端构建
    buildCommand: |
      echo "🚀 开始构建..."
      echo "☕ 使用 Maven 构建（自动包含前端构建）..."
      ./mvnw clean package -DskipTests
      echo "📦 验证 JAR 包中的 React 文件..."
      jar tf target/travel-0.0.1-SNAPSHOT.jar | grep react-dist | head -5 || echo "⚠️ JAR 包中未找到 React 文件"
      echo "✅ 构建完成！"
    startCommand: java -jar target/travel-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: travel-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: travel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: travel-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # 需要在 Render Dashboard 手动设置，格式：https://your-app.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
    healthCheckPath: /actuator/health

databases:
  - name: travel-db
    plan: free
    databaseName: travel_db
    databaseUser: travel_user

