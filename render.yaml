services:
  - type: web
    name: travel-app
    env: java
    # 构建命令：先构建前端，再构建后端
    buildCommand: |
      echo "🚀 开始构建..."
      echo "📦 安装前端依赖..."
      cd frontend && npm install && echo "✅ 前端依赖安装完成"
      echo "🏗️ 构建前端..."
      npm run build && echo "✅ 前端构建完成"
      echo "📋 验证 React 构建文件..."
      ls -la ../src/main/resources/static/react-dist/ || echo "⚠️ React 构建目录不存在"
      ls -la ../src/main/resources/static/react-dist/index.html || echo "⚠️ React index.html 不存在"
      cd ..
      echo "☕ 构建后端..."
      ./mvnw clean package -DskipTests
      echo "📦 验证 JAR 包中的 React 文件..."
      jar tf target/travel-0.0.1-SNAPSHOT.jar | grep react-dist | head -5 || echo "⚠️ JAR 包中未找到 React 文件"
      echo "✅ 构建完成！"
    startCommand: java -jar target/travel-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: travel-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: travel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: travel-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # 需要在 Render Dashboard 手动设置，格式：https://your-app.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/uploads
    healthCheckPath: /actuator/health

databases:
  - name: travel-db
    plan: free
    databaseName: travel_db
    databaseUser: travel_user

