server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:mariadb://localhost:3306/travel_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB  # 单个文件最大10MB
      max-request-size: 100MB  # 整个请求最大100MB（支持9张图片，每张10MB）

jwt:
  secret: ${JWT_SECRET:pV4E@9f!jL#8rXu2Yz*QmN3hS0w^Rk7VbG&cJ5zMdT$PqH6Lx}
  expiration: ${JWT_EXPIRATION:604800000}  # 7天，单位：毫秒

logging:
  level:
    com.example.travel.security.JwtAuthenticationFilter: INFO
    com.example.travel.util.JwtUtil: DEBUG
    org.springframework.security: DEBUG

# 文件上传配置
file:
  upload-dir: ${UPLOAD_DIR:uploads}

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: production
  
  datasource:
    # Railway 支持两种配置方式：
    # 方式1: 直接使用 DATABASE_URL（推荐）
    # 方式2: 使用分别的 DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
    url: ${DATABASE_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_db}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # 生产环境关闭 SQL 日志
    properties:
      hibernate.format_sql: false
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    root: INFO
    com.example.travel: INFO
    org.springframework.security: WARN

file:
  upload-dir: ${UPLOAD_DIR:/tmp/uploads}  # 生产环境使用临时目录或云存储