server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:mariadb://localhost:3306/travel_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB  # 单个文件最大10MB
      max-request-size: 100MB  # 整个请求最大100MB（支持9张图片，每张10MB）

jwt:
  # ⚠️ 生产环境必须设置 JWT_SECRET 环境变量，不能使用默认值
  secret: ${JWT_SECRET:pV4E@9f!jL#8rXu2Yz*QmN3hS0w^Rk7VbG&cJ5zMdT$PqH6Lx}
  expiration: ${JWT_EXPIRATION:604800000}  # 7天，单位：毫秒

# CORS 配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.example.travel.security.JwtAuthenticationFilter: INFO
    com.example.travel.util.JwtUtil: DEBUG
    org.springframework.security: DEBUG

# 文件上传配置
file:
  upload-dir: ${UPLOAD_DIR:uploads}

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: production
  mvc:
    welcome-page:
      enabled: false  # 禁用自动欢迎页面，使用 ReactController 返回 React 应用
  web:
    resources:
      add-mappings: true  # 确保静态资源映射正常工作
  
  datasource:
    # Render 提供的 DATABASE_URL 格式可能是:
    # - postgresql://user:password@host:port/dbname (需要转换为 jdbc:postgresql://)
    # - jdbc:postgresql://host:port/dbname (直接使用)
    # 如果 DATABASE_URL 以 postgresql:// 开头，需要手动转换为 jdbc:postgresql://
    # 或者通过环境变量 DB_DRIVER 明确指定驱动
    url: ${DATABASE_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_db}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 明确指定驱动（Render PostgreSQL 使用 org.postgresql.Driver）
    # 如果使用 MySQL/MariaDB，设置为: org.mariadb.jdbc.Driver
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  
  jpa:
    hibernate:
      # ⚠️ 首次部署：使用 update 自动创建表结构
      # 部署成功后，建议改为 validate 并手动管理数据库迁移
      # 数据库迁移应使用 Flyway 或 Liquibase
      ddl-auto: ${DDL_AUTO:update}  # 可通过环境变量 DDL_AUTO=validate 改为验证模式
    show-sql: false  # 生产环境关闭 SQL 日志
    properties:
      hibernate.format_sql: false
      # 明确指定数据库方言（Render 使用 PostgreSQL）
      # Spring Boot 会自动读取 SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT 环境变量
      # 如果使用 DATABASE_URL 格式，可以通过 HIBERNATE_DIALECT 设置
      hibernate.dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}}

logging:
  level:
    root: INFO
    com.example.travel: INFO
    org.springframework.security: WARN

file:
  upload-dir: ${UPLOAD_DIR:/tmp/uploads}  # 生产环境使用临时目录或云存储

# CORS 配置（生产环境）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-frontend-domain.com}