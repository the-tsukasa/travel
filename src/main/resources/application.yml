server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/travel_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

jwt:
  secret: ${JWT_SECRET:pV4E@9f!jL#8rXu2Yz*QmN3hS0w^Rk7VbG&cJ5zMdT$PqH6Lx}
  expiration: ${JWT_EXPIRATION:604800000}  # 7天，单位：毫秒

logging:
  level:
    com.example.travel.security.JwtAuthenticationFilter: INFO
    com.example.travel.util.JwtUtil: DEBUG
    org.springframework.security: DEBUG

# 文件上传配置
file:
  upload-dir: uploads