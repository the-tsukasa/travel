<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノートを投稿 - Create Note</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding-top: 80px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #718096;
            font-size: 1.1rem;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 1.1rem;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .form-textarea {
            min-height: 200px;
            resize: vertical;
            font-family: inherit;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .char-count {
            text-align: right;
            color: #718096;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .char-count.warning {
            color: #f56565;
        }

        .char-count.error {
            color: #e53e3e;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .form-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<!-- ===== ナビゲーション ===== -->
<link rel="stylesheet" href="css/nav.css" />
<nav class="nav">
    <a href="/index.html" class="brand">
        <span class="brand-dot"></span> TravelGo
    </a>
    <div class="nav-links">
        <a href="spot.html">観光スポット</a>
        <a href="notes.html">みんなの旅行ノート</a>
    </div>
    <div class="nav-cta">
        <a href="/login.html" class="btn-outline">ログイン</a>
        <a href="/register.html" class="btn">登録</a>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>✍️ ノートを投稿</h1>
        <p>あなたの旅の思い出を共有しよう。世界の美しさをみんなと一緒に感じよう。</p>
        <div class="nav-buttons">
            <a href="/notes.html" class="nav-btn">ノートを見る</a>
            <a href="/notes-my.html" class="nav-btn">マイノート</a>
        </div>
    </div>

    <div class="form-container">
        <div id="messageContainer"></div>

        <form id="noteForm">
            <div class="form-group">
                <label class="form-label" for="title">タイトル *</label>
                <input type="text" id="title" name="title" class="form-input"
                       placeholder="魅力的なタイトルを入力してください..." required maxlength="200">
                <div class="char-count" id="titleCount">0/200</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="content">内容 *</label>
                <textarea id="content" name="content" class="form-input form-textarea"
                          placeholder="旅行での体験や感想、見たこと・感じたことを詳しく書いてください..." required maxlength="5000"></textarea>
                <div class="char-count" id="contentCount">0/5000</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="noteImage">画像</label>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label for="noteImageUpload" style="display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 15px; cursor: pointer; text-align: center; font-weight: 600; transition: all 0.3s ease;">
                        📷 画像を選択
                    </label>
                    <input type="file" id="noteImageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                    <div style="color: #718096; font-size: 0.9rem;">
                        画像をアップロード（10MB以下、JPG/PNG/GIF対応）
                    </div>
                </div>
                <div class="image-preview" id="imagePreview"></div>
                <input type="hidden" id="imageUrl" name="imageUrl">
            </div>

            <div class="form-group">
                <label class="form-label" for="location">場所</label>
                <input type="text" id="location" name="location" class="form-input"
                       placeholder="例：東京、日本 ／ パリ、フランス...">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">ノートを投稿</button>
                <a href="/notes.html" class="btn btn-secondary">キャンセル</a>
            </div>
        </form>
    </div>
</div>

<script>
    let currentUser = null;

    // ===== 認証チェック =====
    function checkAuth() {
        const token = localStorage.getItem('token');
        if (!token) {
            showMessage('ノートを投稿するにはログインが必要です。', 'error');
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            return false;
        }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            currentUser = {
                id: payload.sub,
                username: payload.username,
                role: payload.role
            };
            return true;
        } catch (e) {
            localStorage.removeItem('token');
            showMessage('ログインの有効期限が切れました。再度ログインしてください。', 'error');
            setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            return false;
        }
    }

    // ===== メッセージ表示 =====
    function showMessage(message, type = 'error') {
        const container = document.getElementById('messageContainer');
        container.innerHTML = `<div class="${type}">${message}</div>`;
        setTimeout(() => { container.innerHTML = ''; }, 5000);
    }

    // ===== 文字数カウント =====
    function updateCharCount(inputId, countId, maxLength) {
        const input = document.getElementById(inputId);
        const count = document.getElementById(countId);

        input.addEventListener('input', function() {
            const length = this.value.length;
            count.textContent = `${length}/${maxLength}`;

            if (length > maxLength * 0.9) {
                count.className = 'char-count warning';
            } else if (length > maxLength) {
                count.className = 'char-count error';
            } else {
                count.className = 'char-count';
            }
        });
    }

    // ===== 画像アップロード処理 =====
    async function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 验证文件类型
        if (!file.type.startsWith('image/')) {
            showMessage('画像ファイルのみアップロードできます', 'error');
            event.target.value = '';
            return;
        }

        // 验证文件大小 (10MB)
        if (file.size > 10 * 1024 * 1024) {
            showMessage('ファイルサイズは10MB以下にしてください', 'error');
            event.target.value = '';
            return;
        }

        const token = localStorage.getItem('token');
        if (!token) {
            showMessage('ログインが必要です', 'error');
            event.target.value = '';
            return;
        }

        // 显示预览
        const preview = document.getElementById('imagePreview');
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.innerHTML = `<img src="${e.target.result}" alt="画像プレビュー">`;
        };
        reader.readAsDataURL(file);

        const formData = new FormData();
        formData.append('file', file);

        try {
            showMessage('画像をアップロード中...', 'success');
            const response = await fetch('http://localhost:8080/api/upload/note-image', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                // 保存图片URL到隐藏字段
                document.getElementById('imageUrl').value = result.filename; // 存储相对路径
                showMessage('画像が正常にアップロードされました', 'success');
                // 更新预览为服务器返回的URL
                if (result.imageUrl) {
                    preview.innerHTML = `<img src="http://localhost:8080${result.imageUrl}" alt="画像プレビュー">`;
                }
            } else {
                showMessage('アップロードに失敗しました: ' + (result.message || '不明なエラー'), 'error');
                preview.innerHTML = '';
                document.getElementById('imageUrl').value = '';
            }
        } catch (error) {
            console.error('アップロードエラー:', error);
            showMessage('エラーが発生しました: ' + error.message, 'error');
            preview.innerHTML = '';
            document.getElementById('imageUrl').value = '';
        }
    }

    // ===== ノート投稿処理 =====
    document.getElementById('noteForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!checkAuth()) return;

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '投稿中...';

        try {
            const noteData = {
                title: document.getElementById('title').value.trim(),
                content: document.getElementById('content').value.trim(),
                imageUrl: document.getElementById('imageUrl').value.trim() || null,
                location: document.getElementById('location').value.trim() || null
            };

            if (!noteData.title || !noteData.content) {
                throw new Error('タイトルと内容は必須です。');
            }
            if (noteData.title.length > 200) {
                throw new Error('タイトルは200文字以内で入力してください。');
            }
            if (noteData.content.length > 5000) {
                throw new Error('内容は5000文字以内で入力してください。');
            }

            const response = await fetch('/api/notes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify(noteData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || '投稿に失敗しました。');
            }

            showMessage('ノートを投稿しました！承認後、ノート一覧に表示されます。', 'success');
            this.reset();
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('noteImageUpload').value = '';
            document.getElementById('titleCount').textContent = '0/200';
            document.getElementById('contentCount').textContent = '0/5000';
        } catch (error) {
            showMessage(error.message || '投稿に失敗しました。もう一度お試しください。', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'ノートを投稿';
        }
    });

    // ===== 初期化 =====
    document.addEventListener('DOMContentLoaded', function() {
        if (checkAuth()) {
            updateCharCount('title', 'titleCount', 200);
            updateCharCount('content', 'contentCount', 5000);
        }
    });
</script>
<script src="js/nav.js"></script>
</body>
</html>
