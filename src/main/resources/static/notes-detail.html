<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノート詳細 - TravelGo</title>
    <link rel="stylesheet" href="css/nav.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a { color: inherit; text-decoration: none; }
        :root {
            --brand: #ff4d00;
            --brand-dark: #e03e00;
            --bg: #fff9f3;
            --text: #1e293b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP','Hiragino Kaku Gothic ProN','Segoe UI',sans-serif;
            padding-top: 80px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--brand);
            font-weight: 600;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255,255,255,1);
            transform: translateX(-3px);
        }

        .note-detail {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .note-header {
            margin-bottom: 30px;
        }

        .note-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .note-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .note-author {
            font-weight: 600;
            color: var(--brand);
        }

        .note-location {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--brand);
            font-weight: 500;
        }

        .note-date {
            color: #a0aec0;
        }

        .note-images {
            margin: 30px 0;
        }

        .note-image {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .note-image:last-child {
            margin-bottom: 0;
        }

        .note-content {
            color: #4a5568;
            line-height: 1.8;
            font-size: 1.1rem;
            white-space: pre-wrap;
            margin: 30px 0;
        }

        .note-actions {
            display: flex;
            gap: 15px;
            align-items: center;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
        }

        .action-btn {
            background: none;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .action-btn.liked {
            background: #ff6b6b;
            border-color: #ff6b6b;
            color: #fff;
        }

        .action-btn.favorited {
            background: #ffd93d;
            border-color: #ffd93d;
            color: #fff;
        }

        .loading, .error {
            text-align: center;
            padding: 50px;
            color: #718096;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            border-radius: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<!-- ===== ナビゲーション ===== -->
<nav class="nav">
    <a href="/index.html" class="brand">
        <span class="brand-dot"></span> TravelGo
    </a>
    <div class="nav-links">
        <a href="spot.html">観光スポット</a>
        <a href="notes.html">みんなの旅行ノート</a>
    </div>
    <div class="nav-cta">
        <a href="/login.html" class="btn-outline">ログイン</a>
        <a href="/register.html" class="btn">登録</a>
    </div>
</nav>

<div class="container">
    <div class="back-btn" onclick="history.back()">
        ← 戻る
    </div>

    <div id="noteDetail">
        <div class="loading">ノートを読み込み中...</div>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    let noteId = null;

    // 从URL获取笔记ID
    function getNoteIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    // 加载笔记详情
    async function loadNoteDetail() {
        noteId = getNoteIdFromUrl();
        if (!noteId) {
            document.getElementById('noteDetail').innerHTML = 
                '<div class="error">ノートIDが見つかりません。</div>';
            return;
        }

        const container = document.getElementById('noteDetail');
        container.innerHTML = '<div class="loading">ノートを読み込み中...</div>';

        try {
            // 获取token（如果有）
            const token = TokenUtil ? TokenUtil.getToken() : localStorage.getItem('token');
            const headers = {};
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            const res = await fetch(`/api/notes/${noteId}`, { headers });
            
            if (!res.ok) {
                if (res.status === 404) {
                    container.innerHTML = '<div class="error">ノートが見つかりません。</div>';
                } else if (res.status === 403) {
                    container.innerHTML = '<div class="error">このノートはまだ審査中です。</div>';
                } else {
                    container.innerHTML = '<div class="error">ノートの読み込みに失敗しました。</div>';
                }
                return;
            }

            const note = await res.json();
            renderNoteDetail(note);

        } catch (error) {
            console.error('ノート読み込みエラー:', error);
            container.innerHTML = '<div class="error">ノートの読み込みに失敗しました。時間をおいて再試行してください。</div>';
        }
    }

    // 渲染笔记详情
    function renderNoteDetail(note) {
        const container = document.getElementById('noteDetail');
        
        // 处理图片（支持多图片）
        let imagesHtml = '';
        if (note.imageUrls && note.imageUrls.length > 0) {
            imagesHtml = note.imageUrls.map(url => {
                const imageUrl = url.startsWith('http') ? url : (url.startsWith('/') ? url : '/uploads/' + url);
                return `<img src="${imageUrl}" alt="ノート画像" class="note-image" loading="lazy">`;
            }).join('');
        } else if (note.imageUrl) {
            const imageUrl = note.imageUrl.startsWith('http') ? note.imageUrl : (note.imageUrl.startsWith('/') ? note.imageUrl : '/uploads/' + note.imageUrl);
            imagesHtml = `<img src="${imageUrl}" alt="ノート画像" class="note-image" loading="lazy">`;
        }

        const createdAt = new Date(note.createdAt).toLocaleDateString('ja-JP', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        container.innerHTML = `
            <div class="note-detail">
                <div class="note-header">
                    <h1 class="note-title">${escapeHtml(note.title)}</h1>
                    <div class="note-meta">
                        <span class="note-author">by ${escapeHtml(note.username || '匿名')}</span>
                        ${note.location ? `<span class="note-location">📍 ${escapeHtml(note.location)}</span>` : ''}
                        <span class="note-date">${createdAt}</span>
                    </div>
                </div>
                ${imagesHtml ? `<div class="note-images">${imagesHtml}</div>` : ''}
                <div class="note-content">${escapeHtml(note.content)}</div>
                <div class="note-actions">
                    <button class="action-btn ${note.isLiked ? 'liked' : ''}" onclick="toggleLike(${note.id}, this)">
                        ❤️ ${note.likesCount || 0}
                    </button>
                    <button class="action-btn ${note.isFavorited ? 'favorited' : ''}" onclick="toggleFavorite(${note.id}, this)">
                        ⭐ ${note.favoritesCount || 0}
                    </button>
                </div>
            </div>
        `;
    }

    // 点赞/取消点赞
    async function toggleLike(id, btn) {
        if (!window.TokenUtil || !window.ApiUtil) {
            if (confirm('ログインが必要です。ログインページに移動しますか？')) {
                window.location.href = '/login.html';
            }
            return;
        }

        const token = TokenUtil.getToken();
        if (!token) {
            if (confirm('ログインが必要です。ログインページに移動しますか？')) {
                window.location.href = '/login.html';
            }
            return;
        }

        const isLiked = btn.classList.contains('liked');
        const method = isLiked ? 'DELETE' : 'POST';
        
        try {
            const res = await ApiUtil.fetch(`/api/likes/${id}`, { method });
            
            if (res.ok) {
                const num = parseInt(btn.textContent.match(/\d+/)[0]);
                btn.classList.toggle('liked', !isLiked);
                btn.innerHTML = `❤️ ${isLiked ? num - 1 : num + 1}`;
            } else {
                const errorData = await res.json().catch(() => ({}));
                alert(errorData.message || '操作に失敗しました。');
            }
        } catch (error) {
            if (error.message === 'AUTHENTICATION_FAILED' || 
                error.message === 'TOKEN_EXPIRED' || 
                error.message === 'NOT_AUTHENTICATED') {
                return;
            }
            console.error('いいね操作エラー:', error);
            alert('操作に失敗しました。');
        }
    }

    // 收藏/取消收藏
    async function toggleFavorite(id, btn) {
        if (!window.TokenUtil || !window.ApiUtil) {
            if (confirm('ログインが必要です。ログインページに移動しますか？')) {
                window.location.href = '/login.html';
            }
            return;
        }

        const token = TokenUtil.getToken();
        if (!token) {
            if (confirm('ログインが必要です。ログインページに移動しますか？')) {
                window.location.href = '/login.html';
            }
            return;
        }

        const isFav = btn.classList.contains('favorited');
        const method = isFav ? 'DELETE' : 'POST';
        
        try {
            const res = await ApiUtil.fetch(`/api/favorites/${id}`, { method });
            
            if (res.ok) {
                const num = parseInt(btn.textContent.match(/\d+/)[0]);
                btn.classList.toggle('favorited', !isFav);
                btn.innerHTML = `⭐ ${isFav ? num - 1 : num + 1}`;
            } else {
                const errorData = await res.json().catch(() => ({}));
                alert(errorData.message || '操作に失敗しました。');
            }
        } catch (error) {
            if (error.message === 'AUTHENTICATION_FAILED' || 
                error.message === 'TOKEN_EXPIRED' || 
                error.message === 'NOT_AUTHENTICATED') {
                return;
            }
            console.error('お気に入り操作エラー:', error);
            alert('操作に失敗しました。');
        }
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // 检查登录状态
    async function checkLoginStatus() {
        const navCta = document.querySelector(".nav-cta");
        if (!navCta) return;
        
        const token = TokenUtil ? TokenUtil.getToken() : localStorage.getItem("token");
        if (!token) {
            navCta.innerHTML = `<a href="/login.html" class="btn-outline">ログイン</a><a href="/register.html" class="btn">登録</a>`;
            return;
        }
        
        if (TokenUtil && TokenUtil.isTokenExpired(token)) {
            TokenUtil.clearToken();
            navCta.innerHTML = `<a href="/login.html" class="btn-outline">ログイン</a><a href="/register.html" class="btn">登録</a>`;
            return;
        }
        
        try {
            const res = ApiUtil ? await ApiUtil.get('/api/user/me') : await fetch("/api/user/me", { 
                headers: { "Authorization": "Bearer " + token } 
            });
            
            if (!res.ok) {
                if (res.status === 401) {
                    if (TokenUtil) {
                        TokenUtil.clearToken();
                    } else {
                        localStorage.removeItem('token');
                    }
                    navCta.innerHTML = `<a href="/login.html" class="btn-outline">ログイン</a><a href="/register.html" class="btn">登録</a>`;
                    return;
                }
                throw new Error();
            }
            
            const user = await res.json();
            const name = user.username || "ユーザー";
            navCta.innerHTML = `
                <div class="userbar">
                    <span class="userbar-username">👤 ${name}</span>
                    <span class="divider"></span>
                    <a href="/user.html">マイページ</a>
                    <span class="divider"></span>
                    <button onclick="logout()">ログアウト</button>
                </div>`;
        } catch (error) {
            console.error('ログイン状態確認エラー:', error);
            navCta.innerHTML = `<a href="/login.html" class="btn-outline">ログイン</a><a href="/register.html" class="btn">登録</a>`;
        }
    }

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        location.reload();
    }

    // 页面加载时执行
    document.addEventListener('DOMContentLoaded', async () => {
        await checkLoginStatus();
        await loadNoteDetail();
    });
</script>

<script src="js/nav.js"></script>
</body>
</html>
