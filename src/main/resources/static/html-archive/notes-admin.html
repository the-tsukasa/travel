<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノート管理 - Notes Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding-top: 80px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.8rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .header p {
            color: #718096;
            font-size: 1.15rem;
            margin-bottom: 24px;
        }

        .admin-info {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15), rgba(255, 193, 7, 0.05));
            border: 2px solid #ffc107;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .hidden {
            display: none;
        }

        .admin-info h3 {
            color: #856404;
            margin-bottom: 8px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .admin-info p {
            color: #856404;
            font-size: 0.95rem;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 24px 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .stats-section {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.95;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .tabs {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.7s ease-out;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 14px 28px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #718096;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        .search-section {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .notes-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .notes-table th,
        .notes-table td {
            padding: 18px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .notes-table th {
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            font-weight: 700;
            color: #4a5568;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .notes-table tr {
            transition: all 0.2s ease;
        }

        .notes-table tr:hover {
            background: #f7fafc;
            transform: scale(1.01);
        }

        .notes-table tr:last-child td {
            border-bottom: none;
        }

        .note-title {
            font-weight: 700;
            color: #2d3748;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 1.05rem;
        }

        .note-content {
            max-width: 350px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #4a5568;
            line-height: 1.5;
        }

        .note-author {
            color: #667eea;
            font-weight: 600;
        }

        .note-date {
            color: #718096;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-approve {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }

        .btn-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(72, 187, 120, 0.4);
        }

        .btn-reject {
            background: linear-gradient(135deg, #e53e3e, #c53030);
            color: white;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
        }

        .btn-reject:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(229, 62, 62, 0.4);
        }

        .btn-detail {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-detail:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-size: 1.1rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 18px 24px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 4px solid #e53e3e;
        }

        .no-notes {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-size: 1.1rem;
        }

        .no-notes::before {
            content: '📝';
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: white;
            margin: 8% auto;
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.4s ease-out;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4a5568;
        }

        .close {
            color: #aaa;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
            line-height: 1;
        }

        .close:hover {
            color: #000;
        }

        .modal-body {
            color: #4a5568;
            line-height: 1.8;
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #e53e3e, #c53030);
            color: white;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(229, 62, 62, 0.4);
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-cancel:hover {
            background: #cbd5e0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .nav-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-btn {
                width: 100%;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tab-buttons {
                flex-direction: column;
            }

            .tab-btn {
                text-align: left;
            }

            .notes-table {
                font-size: 0.85rem;
            }

            .notes-table th,
            .notes-table td {
                padding: 12px 8px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }

            .modal-content {
                margin: 10% auto;
                padding: 24px;
            }

            .search-section {
                flex-direction: column;
            }

            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<!-- ===== ナビゲーション ===== -->
<link rel="stylesheet" href="css/nav.css" />
<nav class="nav">
    <a href="/index.html" class="brand">
        <span class="brand-dot"></span> TravelGo
    </a>
    <div class="nav-links">
        <a href="spot.html">観光スポット</a>
        <a href="notes.html">みんなの旅行ノート</a>
    </div>
    <div class="nav-cta">
        <a href="/login.html" class="btn-outline">ログイン</a>
        <a href="/register.html" class="btn">登録</a>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>🛠️ ノート管理</h1>
        <p>管理者用ダッシュボード - ユーザー投稿のノートを確認・管理します</p>
        <div id="adminInfo" class="admin-info hidden">
            <h3 id="adminName"></h3>
            <p id="adminRole"></p>
        </div>
        <div class="nav-buttons">
            <a href="/notes.html" class="nav-btn">
                <span>📋</span> ノート一覧
            </a>
            <a href="/admin.html" class="nav-btn">
                <span>⚙️</span> 管理画面
            </a>
            <a href="/login.html" class="nav-btn" onclick="logout()">
                <span>🚪</span> ログアウト
            </a>
        </div>
    </div>

    <div class="stats-section">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalNotes">0</div>
                <div class="stat-label">ノート総数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingNotes">0</div>
                <div class="stat-label">承認待ち</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="approvedNotes">0</div>
                <div class="stat-label">公開済み</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="rejectedNotes">0</div>
                <div class="stat-label">拒否済み</div>
            </div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('pending')">📋 承認待ち</button>
            <button class="tab-btn" onclick="switchTab('all')">📚 すべてのノート</button>
        </div>

        <div id="pendingTab" class="tab-content active">
            <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; color: #2d3748;">
                📋 承認待ちノート
            </h3>
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="🔍 タイトル、投稿者、内容で検索..."
                    onkeyup="filterNotes()"
                />
            </div>
            <div id="pendingContainer">
                <div class="loading">承認待ちノートを読み込み中</div>
            </div>
        </div>

        <div id="allTab" class="tab-content">
            <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; color: #2d3748;">
                📚 全ノート一覧
            </h3>
            <div id="allContainer">
                <div class="no-notes">全ノート機能は開発中です</div>
            </div>
        </div>
    </div>
</div>

<!-- 拒否確認モーダル -->
<div id="rejectModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">⚠️ 拒否の確認</h3>
            <span class="close" onclick="closeRejectModal()">&times;</span>
        </div>
        <div class="modal-body">
            このノートを拒否しますか？この操作は取り消せません。
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeRejectModal()">キャンセル</button>
            <button class="btn btn-confirm" id="confirmRejectBtn">拒否する</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let noteToReject = null;
    let currentTab = 'pending';
    let allPendingNotes = [];

    // ===== 管理者認証チェック =====
    function checkAdminAuth() {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('まずログインしてください。');
            window.location.href = '/login.html';
            return false;
        }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            currentUser = {
                id: payload.sub,
                username: payload.username,
                role: payload.role
            };

            if (currentUser.role !== 'ADMIN') {
                alert('アクセス権がありません。管理者のみがこのページを利用できます。');
                window.location.href = '/notes.html';
                return false;
            }

            return true;
        } catch (e) {
            localStorage.removeItem('token');
            alert('ログイン情報の有効期限が切れました。再度ログインしてください。');
            window.location.href = '/login.html';
            return false;
        }
    }

    // ===== 管理者情報表示 =====
    function displayAdminInfo() {
        if (currentUser) {
            document.getElementById('adminName').textContent = `管理者：${currentUser.username}`;
            document.getElementById('adminRole').textContent = `権限：${currentUser.role}`;
            document.getElementById('adminInfo').classList.remove('hidden');
        }
    }

    // ===== 統計情報更新 =====
    function updateStats(notes) {
        document.getElementById('totalNotes').textContent = notes.length;
        document.getElementById('pendingNotes').textContent = notes.length;
        // 这里可以添加更多统计逻辑
    }

    // ===== タブ切り替え =====
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(tab + 'Tab').classList.add('active');
        currentTab = tab;

        if (tab === 'pending') {
            loadPendingNotes();
        } else if (tab === 'all') {
            loadAllNotes();
        }
    }

    // ===== 承認待ちノートの読み込み =====
    async function loadPendingNotes() {
        try {
            const container = document.getElementById('pendingContainer');
            container.innerHTML = '<div class="loading">承認待ちノートを読み込み中</div>';

            const response = await fetch('/api/admin/notes/pending', {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });

            if (!response.ok) throw new Error('読み込み失敗');
            const notes = await response.json();
            allPendingNotes = notes;
            updateStats(notes);
            displayPendingNotes(notes);
        } catch (error) {
            document.getElementById('pendingContainer').innerHTML =
                '<div class="error">承認待ちノートの読み込みに失敗しました。時間をおいて再試行してください。</div>';
        }
    }

    // ===== ノートリスト表示 =====
    function displayPendingNotes(notes) {
        const container = document.getElementById('pendingContainer');
        if (!notes || notes.length === 0) {
            container.innerHTML = '<div class="no-notes">承認待ちのノートはありません</div>';
            return;
        }

        const tableHtml = `
        <table class="notes-table">
            <thead>
                <tr>
                    <th>タイトル</th>
                    <th>投稿者</th>
                    <th>内容プレビュー</th>
                    <th>作成日</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                ${notes.map(note => `
                    <tr data-note-id="${note.id}">
                        <td><div class="note-title" title="${escapeHtml(note.title)}">${escapeHtml(note.title)}</div></td>
                        <td class="note-author">${escapeHtml(note.username)}</td>
                        <td><div class="note-content" title="${escapeHtml(note.content)}">${escapeHtml(note.content)}</div></td>
                        <td class="note-date">${new Date(note.createdAt).toLocaleDateString('ja-JP')}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn btn-approve" onclick="approveNote(${note.id})">✅ 承認</button>
                                <button class="action-btn btn-reject" onclick="showRejectModal(${note.id})">❌ 拒否</button>
                                <button class="action-btn btn-detail" onclick="viewNoteDetail(${note.id})">👁️ 詳細</button>
                            </div>
                        </td>
                    </tr>`).join('')}
            </tbody>
        </table>`;
        container.innerHTML = tableHtml;
    }

    // ===== 検索フィルター =====
    function filterNotes() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('.notes-table tbody tr');
        
        rows.forEach(row => {
            const title = row.querySelector('.note-title').textContent.toLowerCase();
            const author = row.querySelector('.note-author').textContent.toLowerCase();
            const content = row.querySelector('.note-content').textContent.toLowerCase();
            
            if (title.includes(searchTerm) || author.includes(searchTerm) || content.includes(searchTerm)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // ===== 承認済・全件読み込み =====
    async function loadAllNotes() {
        const container = document.getElementById('allContainer');
        container.innerHTML = '<div class="no-notes">全ノート機能は開発中です</div>';
    }

    // ===== ノート承認 =====
    async function approveNote(noteId) {
        if (!confirm('このノートを承認しますか？')) return;
        try {
            const res = await fetch(`/api/admin/notes/${noteId}/approve`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            if (!res.ok) throw new Error();
            alert('✅ ノートを承認しました。');
            loadPendingNotes();
        } catch {
            alert('❌ 承認に失敗しました。');
        }
    }

    // ===== 拒否モーダル =====
    function showRejectModal(noteId) {
        noteToReject = noteId;
        document.getElementById('rejectModal').style.display = 'block';
    }
    
    function closeRejectModal() {
        document.getElementById('rejectModal').style.display = 'none';
        noteToReject = null;
    }
    
    async function confirmReject() {
        if (!noteToReject) return;
        try {
            const res = await fetch(`/api/admin/notes/${noteToReject}/reject`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            if (!res.ok) throw new Error();
            closeRejectModal();
            alert('✅ ノートを拒否しました。');
            loadPendingNotes();
        } catch {
            alert('❌ 拒否処理に失敗しました。');
        }
    }

    // ===== 詳細表示 =====
    function viewNoteDetail(noteId) {
        window.location.href = `/notes-detail.html?id=${noteId}`;
    }

    // ===== ログアウト =====
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/login.html';
    }

    // ===== HTML エスケープ =====
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== 初期化 =====
    document.addEventListener('DOMContentLoaded', function() {
        if (checkAdminAuth()) {
            displayAdminInfo();
            loadPendingNotes();
        }
        document.getElementById('confirmRejectBtn').addEventListener('click', confirmReject);
        document.querySelector('.close').addEventListener('click', closeRejectModal);
        document.getElementById('rejectModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeRejectModal();
        });
    });
</script>
<script src="js/nav.js"></script>
</body>
</html>
