<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>プロフィール編集 · TravelGo</title>
    <link rel="stylesheet" href="css/nav.css" />
    <style>
    :root {
        --orange: #ff4d00;
        --white: #ffffff;
        --text: #1a1a1a;
        --gray: #d1d5db;
        --bg: #fff8f4;
    }

    /* ===== 全局重置 ===== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        min-height: 100vh;
        font-family: "Segoe UI", "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-top: 40px;
    }

    /* ===== 页面容器 ===== */
    .page-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
    }

    /* ===== 标题区域 ===== */
    .page-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .page-header h1 {
        font-size: 32px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 8px;
    }

    .page-header p {
        color: #666;
        font-size: 14px;
    }

    /* ===== 表单卡片 ===== */
    .form-card {
        background: var(--white);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    /* ===== 表单组 ===== */
    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 15px;
        font-family: inherit;
        transition: all 0.3s ease;
        background: #fff;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(255, 77, 0, 0.1);
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    .form-group input[type="date"] {
        cursor: pointer;
    }

    /* ===== 头像预览区域 ===== */
    .avatar-section {
        text-align: center;
        margin-bottom: 32px;
        padding-bottom: 32px;
        border-bottom: 1px solid #e5e7eb;
    }

    .avatar-preview {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid var(--orange);
        margin-bottom: 16px;
        background: #f3f4f6;
    }

    .avatar-url-input {
        max-width: 500px;
        margin: 0 auto;
    }

    /* ===== 按钮组 ===== */
    .button-group {
        display: flex;
        gap: 16px;
        margin-top: 32px;
        justify-content: flex-end;
    }

    .btn {
        padding: 14px 32px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-primary {
        background: var(--orange);
        color: white;
        box-shadow: 0 4px 12px rgba(255, 77, 0, 0.3);
    }

    .btn-primary:hover {
        background: #ff6420;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(255, 77, 0, 0.4);
    }

    .btn-secondary {
        background: #f3f4f6;
        color: #333;
    }

    .btn-secondary:hover {
        background: #e5e7eb;
    }

    /* ===== 消息提示 ===== */
    .message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 24px;
        font-size: 14px;
        display: none;
    }

    .message.success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
        display: block;
    }

    .message.error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
        display: block;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
        .page-container {
            margin: 20px auto;
            padding: 0 16px;
        }

        .form-card {
            padding: 24px;
        }

        .button-group {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }
    }
    </style>
</head>
<body>
<!-- ===== ナビゲーション ===== -->
<nav class="nav">
    <a href="/index.html" class="brand">
        <span class="brand-dot"></span> TravelGo
    </a>
    <div class="nav-links">
        <a href="spot.html">観光スポット</a>
        <a href="notes.html">みんなの旅行ノート</a>
    </div>
    <div class="nav-cta">
        <a href="/user.html" class="btn-outline">マイページ</a>
        <a href="/login.html" class="btn">ログイン</a>
    </div>
</nav>

<div class="page-container">
    <div class="page-header">
        <h1>プロフィール編集</h1>
        <p>あなたの情報を更新してください</p>
    </div>

    <!-- 消息提示 -->
    <div id="message" class="message"></div>

    <div class="form-card">
        <!-- 头像区域 -->
        <div class="avatar-section">
            <img id="avatarPreview" class="avatar-preview" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Avatar Preview">
            <div class="avatar-url-input">
                <label for="avatarUrl">アバターURL</label>
                <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.jpg" oninput="updateAvatarPreview()">
            </div>
        </div>

        <!-- 表单字段 -->
        <form id="profileForm">
            <div class="form-group">
                <label for="firstName">名（First Name）</label>
                <input type="text" id="firstName" placeholder="名を入力">
            </div>

            <div class="form-group">
                <label for="lastName">姓（Last Name）</label>
                <input type="text" id="lastName" placeholder="姓を入力">
            </div>

            <div class="form-group">
                <label for="bio">自己紹介（Bio）</label>
                <textarea id="bio" placeholder="あなたについて簡単に紹介してください"></textarea>
            </div>

            <div class="form-group">
                <label for="location">所在地（Location）</label>
                <input type="text" id="location" placeholder="例：日本、東京">
            </div>

            <div class="form-group">
                <label for="address">住所（Address）</label>
                <input type="text" id="address" placeholder="詳細な住所を入力">
            </div>

            <div class="form-group">
                <label for="birthday">誕生日（Birthday）</label>
                <input type="date" id="birthday">
            </div>

            <!-- 按钮组 -->
            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="cancelEdit()">キャンセル</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<script>
    // 更新头像预览
    function updateAvatarPreview() {
        const url = document.getElementById('avatarUrl').value.trim();
        const preview = document.getElementById('avatarPreview');
        if (url) {
            preview.src = url;
            preview.onerror = function() {
                this.src = 'https://cdn-icons-png.flaticon.com/512/616/616408.png';
            };
        } else {
            preview.src = 'https://cdn-icons-png.flaticon.com/512/616/616408.png';
        }
    }

    // 加载当前用户信息
    async function loadUserProfile() {
        const token = localStorage.getItem('token');
        if (!token) {
            showMessage('ログインが必要です', 'error');
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 2000);
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/api/user/me', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const user = await response.json();
                
                // 填充表单
                if (user.firstName) document.getElementById('firstName').value = user.firstName;
                if (user.lastName) document.getElementById('lastName').value = user.lastName;
                if (user.bio) document.getElementById('bio').value = user.bio;
                if (user.location) document.getElementById('location').value = user.location;
                if (user.address) document.getElementById('address').value = user.address;
                if (user.birthday) {
                    // 将 LocalDate 格式转换为 input[type="date"] 需要的格式 (YYYY-MM-DD)
                    document.getElementById('birthday').value = user.birthday;
                }
                if (user.avatarUrl) {
                    document.getElementById('avatarUrl').value = user.avatarUrl;
                    updateAvatarPreview();
                }
            } else {
                showMessage('ユーザー情報の取得に失敗しました', 'error');
            }
        } catch (error) {
            console.error('Error loading profile:', error);
            showMessage('エラーが発生しました: ' + error.message, 'error');
        }
    }

    // 保存个人资料
    async function saveProfile(event) {
        event.preventDefault();

        const token = localStorage.getItem('token');
        if (!token) {
            showMessage('ログインが必要です', 'error');
            return;
        }

        // 收集表单数据
        const profileData = {
            firstName: document.getElementById('firstName').value.trim() || null,
            lastName: document.getElementById('lastName').value.trim() || null,
            avatarUrl: document.getElementById('avatarUrl').value.trim() || null,
            bio: document.getElementById('bio').value.trim() || null,
            location: document.getElementById('location').value.trim() || null,
            address: document.getElementById('address').value.trim() || null,
            birthday: document.getElementById('birthday').value || null
        };

        try {
            const response = await fetch('http://localhost:8080/api/user/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(profileData)
            });

            if (response.ok) {
                showMessage('プロフィールが正常に更新されました！', 'success');
                setTimeout(() => {
                    window.location.href = '/user.html';
                }, 1500);
            } else {
                const errorText = await response.text();
                showMessage('更新に失敗しました: ' + errorText, 'error');
            }
        } catch (error) {
            console.error('Error saving profile:', error);
            showMessage('エラーが発生しました: ' + error.message, 'error');
        }
    }

    // 显示消息
    function showMessage(text, type) {
        const messageEl = document.getElementById('message');
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
    }

    // 取消编辑
    function cancelEdit() {
        if (confirm('変更を破棄しますか？')) {
            window.location.href = '/user.html';
        }
    }

    // 表单提交事件
    document.getElementById('profileForm').addEventListener('submit', saveProfile);

    // 页面加载时获取用户信息
    window.addEventListener('DOMContentLoaded', loadUserProfile);
</script>
<script src="js/nav.js"></script>
</body>
</html>
